[package]
name = "lineme"
version = "0.1.0"
edition = "2024"

[dependencies]
analyzeme = "12.0.3"
iced = { version = "0.14", features = ["wgpu", "tokio", "advanced", "canvas", "svg"] }
intervaltree = "0.2.7"
rayon = "1.10"
rfd = "0.17.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.9"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
